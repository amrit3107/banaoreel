# Required for any AndroidX-based project (Compose, Media3, Hilt, etc. all are
# AndroidX libraries) -- without this, Gradle refuses to build at all.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Default daemon heap (512 MiB) is too small for this dependency graph --
# Compose + Firebase + Media3 + Razorpay + Hilt pull in enough transitive
# dependencies that D8 (the dexer) runs out of heap merging them.
# Bump both heap and metaspace; adjust downward if your machine has limited RAM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
kotlin.code.style=official
