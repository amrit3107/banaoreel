spring:
  application:
    name: banaoreel-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/banaoreel
    username: banaoreel
    password: changeme
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

banaoreel:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod}
    expiry-minutes: 43200 # 30 days
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_xxx}
    key-secret: ${RAZORPAY_KEY_SECRET:xxx}
  worker:
    internal-api-key: ${WORKER_INTERNAL_API_KEY:change-this-shared-secret}
    queue-url: ${SQS_QUEUE_URL:https://sqs.ap-south-1.amazonaws.com/xxxxxxxxxxxx/banaoreel-video-jobs}
  aws:
    region: ap-south-1
  sms:
    msg91-auth-key: ""
    msg91-template-id: ""
  pricing:
    tier-15s-paise: 500
    tier-30s-paise: 1000
